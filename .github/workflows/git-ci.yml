name: Pull Request Tests

on:
  pull_request:
    branches:
      - main
      
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: goto-bus-stop/setup-zig@v2
      - name: Install latest stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tools
        run: cargo install cargo-lambda cargo-insta
      - name: Build
        run: ./scripts/build-release.sh # Builds for ARM Lambda
      - name: Release
        run: |
          npm i @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/changelog @semantic-release/git
          npx semantic-release
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: global_retention_setter
          path: dist/global_retention_setter/bootstrap
          retention-days: 14 # Used for testing purposes on MR
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: log_retention_setter
          path: dist/log_retention_setter/bootstrap
          retention-days: 14 # Used for testing purposes on MR
      
  test:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - name: Install latest stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tools
        run: cargo install cargo-lambda cargo-insta
      - name: Run cargo test
        run: cargo test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      - name: Run cargo tarpaulin
        run: cargo tarpaulin # Settings (engine, excludes, fail-under) in .tarpaulin.toml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/
          retention-days: 14

  terraform-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push regenerated docs back to the PR branch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      # Same-repo PRs: regenerate the README's Terraform docs section and push it back to the branch.
      - name: Generate Terraform docs
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          config-file: .terraform-docs.yml
          output-method: ""
          git-push: true
          git-commit-message: "docs: ✏️ Regenerate Terraform docs"
      # Fork PRs: we can't push to the fork, so fail if the docs are stale and let the contributor run `terraform-docs .`.
      - name: Check Terraform docs are up to date
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          config-file: .terraform-docs.yml
          output-method: ""
          fail-on-diff: true

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tools
        run: cargo install cargo-audit
      - name: Run cargo audit
        run: cargo audit -D warnings
